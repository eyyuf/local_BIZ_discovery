<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="maedBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E24" />
      <stop offset="100%" stop-color="#0E0E12" />
    </linearGradient>
    <linearGradient id="maedGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="beaconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="1.5" y="1.5" width="45" height="45" rx="13" fill="url(#maedBg)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2" />
  <rect x="3" y="3" width="42" height="42" rx="11.5" fill="none" stroke="url(#maedGold)" stroke-width="0.8" stroke-opacity="0.35" />

  <!-- Left Pillar -->
  <path d="M12 34V19.5C12 18.1 13.1 17 14.5 17C15.9 17 17 18.1 17 19.5V34" stroke="#F5F2EA" stroke-width="2.4" stroke-linecap="round" />

  <!-- Right Pillar -->
  <path d="M36 34V19.5C36 18.1 34.9 17 33.5 17C32.1 17 31 18.1 31 19.5V34" stroke="#F5F2EA" stroke-width="2.4" stroke-linecap="round" />

  <!-- Cloche Dome -->
  <path d="M17 25C17 20 20.1 16 24 16C27.9 16 31 20 31 25" stroke="url(#maedGold)" stroke-width="2.6" stroke-linecap="round" />

  <!-- Platter Table Line -->
  <path d="M15 30.5H33" stroke="url(#maedGold)" stroke-width="2" stroke-linecap="round" />

  <!-- Beacon Finial -->
  <circle cx="24" cy="12" r="2.2" fill="url(#maedGold)" filter="url(#beaconGlow)" />
  <circle cx="24" cy="12" r="1.2" fill="#FFFBEB" />
</svg>
